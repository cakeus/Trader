<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1426" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trader" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/goods/strawberry.png" />
    <link rel="apple-touch-icon" href="/assets/goods/strawberry.png" />
    <title>Trader</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #1a1426;
        overflow: hidden;
        overscroll-behavior: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* no pull-to-refresh, pinch zoom, double-tap zoom, text selection or tap flashes */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <canvas id="screen"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
